[project]
name = "langchain-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12, >=3.14"
dependencies = [
    "grandalf>=0.8",
    "langchain>=1.4.2",
    "langchain-classic>=1.0.8",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.5",
    "langchain-openrouter>=0.2.9",
    "langchainhub>=0.1.21",
    "openmeteo-requests>=1.7.5",
    "pandas>=3.0.6",
    "python-dotenv>=1.2.3",
    "requests-cache>=1.3.3",
    "retry-requests>=2.0.0",
    "streamlit>=1.64.0",
]

[project.scripts]
langchain-agent = "langchain_agent:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
